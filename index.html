<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        background: #050505;
      }
      #preload-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: stretch;
        background:
          radial-gradient(520px 320px at 22% 18%, rgba(55, 180, 190, 0.22), rgba(0, 0, 0, 0) 62%),
          radial-gradient(520px 320px at 78% 22%, rgba(124, 115, 255, 0.20), rgba(0, 0, 0, 0) 62%),
          radial-gradient(900px 560px at 50% 70%, rgba(45, 108, 223, 0.18), rgba(0, 0, 0, 0) 60%),
          #050505;
        z-index: 99999;
        overflow: hidden;
        opacity: 1;
        transition: opacity 220ms ease-out;
      }
      #preload-splash.preload-hide {
        opacity: 0;
      }
      .preload-card {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 22px 22px 18px;
        box-sizing: border-box;
      }
      .preload-inner {
        width: min(420px, calc(100vw - 44px));
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.10);
        background: rgba(12, 12, 12, 0.82);
        box-shadow:
          0 28px 90px rgba(0, 0, 0, 0.62),
          0 0 0 1px rgba(255, 255, 255, 0.03) inset;
        backdrop-filter: blur(14px);
        padding: 18px 18px 16px;
        display: grid;
        justify-items: center;
        transform: translateY(10px);
        opacity: 0;
        animation: preloadCardIn 420ms ease-out forwards;
      }
      @keyframes preloadCardIn {
        from {
          transform: translateY(10px) scale(0.98);
          opacity: 0;
        }
        to {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }
      .preload-gif {
        width: 280px;
        height: 200px;
        object-fit: contain;
        display: block;
      }
      .preload-gif-wrap {
        border-radius: 18px;
        padding: 10px;
        box-shadow:
          0 18px 60px rgba(0, 0, 0, 0.35),
          0 0 0 1px rgba(0, 0, 0, 0.05) inset;
      }
      .preload-title {
        margin-top: 4px;
        font-size: 22px;
        font-weight: 800;
        color: #fff;
        letter-spacing: -0.2px;
        text-align: center;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
      }
      .preload-subtitle {
        margin-top: 6px;
        font-size: 12px;
        text-align: center;
        color: rgba(209, 213, 219, 0.62);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
      }
      .preload-progress {
        height: 8px;
        width: 100%;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        margin-top: 14px;
      }
      .preload-bar {
        height: 100%;
        width: 32%;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(45, 108, 223, 0.95), rgba(55, 180, 190, 0.95));
        animation: preloadBar 1.1s ease-in-out infinite;
      }
      @keyframes preloadBar {
        0% {
          transform: translateX(-35%);
          opacity: 0.75;
        }
        50% {
          transform: translateX(105%);
          opacity: 1;
        }
        100% {
          transform: translateX(240%);
          opacity: 0.75;
        }
      }
    </style>
    <title>FoPanel</title>
  </head>
  <body>
    <div id="preload-splash">
      <div class="preload-card">
        <div class="preload-inner">
          <div class="preload-gif-wrap" id="splash-lottie" style="width: 280px; height: 200px;">
          </div>
          <div class="preload-title">FoPanel</div>
          <div class="preload-subtitle">一体化开发环境工作台</div>
          <div class="preload-progress">
            <div class="preload-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script src="/lottie/lottie_light.min.js"></script>
    <script>
        // 避免等待 DOMContentLoaded，直接立即执行脚本，以最快速度加载动画
      (function() {
        const container = document.getElementById('splash-lottie');
        if (container && window.lottie) {
          const anim = window.lottie.loadAnimation({
            container: container,
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: '/lottie/splash.json'
          });
          anim.setSpeed(1.5); // 加快播放速度
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
